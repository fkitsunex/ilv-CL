# this is only used to disable shadow casting for entity 10000
entity.10000=lightning_bolt
# nametags (floating name labels): flagged so gbuffers_entities renders them as a flat
# unlit overlay instead of a lit/reflective surface that corrupts the gbuffer behind them.
entity.10001=name_tag

# [dynamic coloured lighting] light-emitting mobs: voxelised in gbuffers_entities so the colour
# floodfill lights the world around them (see dynamicLightEntityVoxelId in dynamicLight.glsl).
entity.10010=glow_squid
entity.10011=magma_cube

# players: their skin's semi-transparent texels are drawn as dithered (order-independent) transparency in
# gbuffers_entities — blended translucency depended on the draw order of the skin layers (see there)
entity.10002=player
